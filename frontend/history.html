<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meu Histórico — Verifica Notícia</title>
  <meta name="description"
    content="Histórico de notícias verificadas, estatísticas e resultados salvos no Verifica Notícia." />
  <link rel="stylesheet" href="css/style.css?v=3" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="navbar-brand">
        <div class="brand-icon-wrapper">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
        <span>Verifica <span class="brand-text-accent">Notícia</span></span>
      </a>
      <div class="navbar-actions" id="navbarActions">
        <!-- Injetado dinamicamente pelo auth.js -->
      </div>
    </div>
  </nav>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="main-content">
    <div class="container">
      <div
        style="display:flex; align-items:center; justify-content:space-between; margin-bottom:32px; flex-wrap:wrap; gap:16px;">
        <div>
          <h1 class="section-title">Meu Histórico</h1>
          <p class="section-subtitle">Todas as suas verificações e análises factuais salvas</p>
        </div>
        <a href="index.html" class="btn btn-primary">
          <i class="fa-solid fa-plus"></i> Nova Verificação
        </a>
      </div>

      <!-- Container gerenciado dinamicamente pelo js/history.js -->
      <div id="historyContent">
        <div style="text-align:center; padding:60px 20px;">
          <div class="loading-spinner" style="margin:0 auto 16px;"></div>
          <p style="color:var(--text-secondary); font-weight:500;">Carregando histórico...</p>
        </div>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <i class="fa-solid fa-shield-halved" style="color:var(--primary)"></i>
        <span>Verifica Notícia</span>
      </div>
      <p>Projeto acadêmico de combate à desinformação com IA • Cruzeiro do Sul 2026</p>
      <p style="margin-top:8px; font-size:0.82rem; color:var(--text-muted);">
        © 2026 Verifica Notícia — Todos os direitos reservados
      </p>
    </div>
  </footer>

  <script src="js/auth.js?v=3"></script>
  <script src="js/api.js?v=3"></script>
  <script src="js/history.js?v=3"></script>
</body>

</html>
