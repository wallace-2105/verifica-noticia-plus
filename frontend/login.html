<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Entrar — Verifica Notícia</title>
  <meta name="description" content="Acesse sua conta para salvar e sincronizar seu histórico de verificações de notícias."/>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="navbar-brand">
        <div class="brand-icon-wrapper">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
        <span>Verifica <span class="brand-text-accent">Notícia</span></span>
      </a>
      <div class="navbar-actions" id="navbarActions">
        <!-- Injetado dinamicamente pelo auth.js -->
      </div>
    </div>
  </nav>

  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="auth-logo-icon">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h2 class="auth-title">Bem-vindo de volta!</h2>
        <p class="auth-subtitle">Entre na sua conta para acessar seu histórico em qualquer dispositivo</p>
      </div>

      <div id="alertBox"></div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="email">E-mail</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-envelope input-icon"></i>
            <input
              type="email"
              class="form-input"
              id="email"
              placeholder="seu@email.com"
              required
              autocomplete="email"
            />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Senha</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-lock input-icon"></i>
            <input
              type="password"
              class="form-input"
              id="password"
              placeholder="Digite sua senha"
              required
              autocomplete="current-password"
            />
            <button type="button" class="input-toggle-password" onclick="togglePassword('password')" title="Mostrar/ocultar senha">
              <i class="fa-solid fa-eye" id="eyeIcon"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-full btn-lg" id="btnLogin">
          <i class="fa-solid fa-right-to-bracket"></i>
          Entrar na Conta
        </button>
      </form>

      <div class="divider">ou continue sem login</div>

      <a href="index.html" class="btn btn-ghost w-full">
        <i class="fa-solid fa-magnifying-glass"></i>
        Verificar Notícia sem Cadastro
      </a>

      <p style="text-align:center; margin-top:24px; font-size:0.92rem; color:var(--text-secondary);">
        Não tem uma conta?
        <a href="register.html" style="color:var(--primary); font-weight:700; text-decoration:none;">Cadastre-se grátis</a>
      </p>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-inner">
      <p>© 2026 Verifica Notícia — Combate inteligente à desinformação</p>
    </div>
  </footer>

  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script>
    if (auth.isLoggedIn()) window.location.href = 'index.html';

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('btnLogin');
      const alertBox = document.getElementById('alertBox');
      alertBox.innerHTML = '';

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Entrando...';

      try {
        const data = await api.login({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        });

        auth.setToken(data.token, data.user);
        showToast('Login realizado com sucesso! Redirecionando...', 'success');
        setTimeout(() => window.location.href = 'index.html', 900);

      } catch (error) {
        alertBox.innerHTML = `
          <div class="toast toast-error show" style="margin-bottom:20px; width:100%; max-width:100%;">
            <div class="toast-icon"><i class="fa-solid fa-circle-xmark"></i></div>
            <div class="toast-msg">${error.message || 'Erro ao realizar login.'}</div>
          </div>
        `;
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Entrar na Conta';
      }
    }

    function togglePassword(id) {
      const input = document.getElementById(id);
      const icon = document.getElementById('eyeIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    }
  </script>
</body>
</html>
